<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc">
  <title id="title">WP Japanese Translation Checker v1 画面イメージ</title>
  <desc id="desc">POファイル選択、確認結果、ErrorとWarning、原文と翻訳の比較を示す代表画面</desc>
  <rect width="1200" height="1180" fill="#f5f7fa"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" fill="#17212b">
    <text x="80" y="72" font-size="14" font-weight="700" fill="#2145c7">HTML MOCK / V1</text>
    <text x="80" y="122" font-size="38" font-weight="700">WP Japanese Translation Checker</text>
    <text x="80" y="158" font-size="17" fill="#667085">原文と翻訳を横並びで比較し、長い内容は省略表示から全文を確認できる画面イメージ</text>

    <rect x="70" y="195" width="1060" height="200" rx="18" fill="#fff" stroke="#dfe5ec"/>
    <circle cx="105" cy="235" r="17" fill="#3858e9"/>
    <text x="100" y="241" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="135" y="242" font-size="22" font-weight="700">.po ファイルを選択</text>

    <rect x="95" y="270" width="1010" height="72" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <rect x="115" y="283" width="48" height="46" rx="10" fill="#eef2ff"/>
    <text x="128" y="311" font-size="13" font-weight="800" fill="#2145c7">PO</text>
    <text x="180" y="301" font-size="16" font-weight="700">sample-ja.po</text>
    <text x="180" y="324" font-size="13" fill="#667085">日本語翻訳ファイル</text>
    <rect x="925" y="286" width="155" height="40" rx="9" fill="#fff" stroke="#cbd5e1"/>
    <text x="951" y="311" font-size="14" font-weight="700">ファイルを選び直す</text>

    <rect x="95" y="352" width="1010" height="44" rx="10" fill="#3858e9"/>
    <text x="536" y="380" font-size="15" font-weight="800" fill="#fff">翻訳を確認する</text>

    <rect x="70" y="425" width="1060" height="680" rx="18" fill="#fff" stroke="#dfe5ec"/>
    <circle cx="105" cy="465" r="17" fill="#3858e9"/>
    <text x="100" y="471" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="135" y="472" font-size="22" font-weight="700">確認結果</text>

    <rect x="95" y="500" width="1010" height="105" rx="13" fill="#fbfcfe" stroke="#dfe5ec"/>
    <text x="118" y="528" font-size="12" font-weight="800" fill="#2145c7">確認が完了しました</text>
    <text x="118" y="558" font-size="20" font-weight="700">3件の確認項目があります</text>
    <text x="118" y="584" font-size="14" fill="#667085">Error は高い確度で問題と判断できる指摘、Warning は人による確認が必要な指摘です。</text>
    <rect x="890" y="519" width="82" height="68" rx="11" fill="#fef3f2"/>
    <text x="910" y="542" font-size="12" font-weight="800" fill="#b42318">Error</text>
    <text x="923" y="572" font-size="26" font-weight="800" fill="#b42318">2</text>
    <rect x="983" y="519" width="92" height="68" rx="11" fill="#fffaeb"/>
    <text x="999" y="542" font-size="12" font-weight="800" fill="#9a6700">Warning</text>
    <text x="1022" y="572" font-size="26" font-weight="800" fill="#9a6700">1</text>

    <rect x="95" y="625" width="1010" height="220" rx="12" fill="#fff" stroke="#dfe5ec"/>
    <rect x="118" y="646" width="54" height="28" rx="14" fill="#fef3f2"/>
    <text x="129" y="665" font-size="12" font-weight="800" fill="#b42318">Error</text>
    <text x="1055" y="664" font-size="12" font-weight="700" fill="#94a3b8">#1</text>
    <text x="118" y="704" font-size="18" font-weight="700">半角文字と全角文字の間に不要なスペースがあります</text>

    <rect x="118" y="725" width="462" height="70" rx="10" fill="#f8fafc" stroke="#dfe5ec"/>
    <text x="136" y="746" font-size="12" font-weight="800" fill="#667085">原文</text>
    <text x="136" y="776" font-size="15">Activate plugin</text>
    <rect x="594" y="725" width="488" height="70" rx="10" fill="#f8fafc" stroke="#dfe5ec"/>
    <text x="612" y="746" font-size="12" font-weight="800" fill="#667085">翻訳</text>
    <text x="612" y="776" font-size="15">プラグイン を有効化</text>

    <text x="118" y="820" font-size="12" font-weight="800" fill="#667085">判定理由</text>
    <text x="205" y="820" font-size="14">日本語と半角英数字の間には、原則としてスペースを入れません。</text>

    <rect x="95" y="865" width="1010" height="215" rx="12" fill="#fff" stroke="#dfe5ec"/>
    <rect x="118" y="886" width="72" height="28" rx="14" fill="#fffaeb"/>
    <text x="128" y="905" font-size="12" font-weight="800" fill="#9a6700">Warning</text>
    <text x="1055" y="904" font-size="12" font-weight="700" fill="#94a3b8">#2</text>
    <text x="118" y="944" font-size="18" font-weight="700">「View XX」の訳し方を確認してください</text>

    <rect x="118" y="965" width="462" height="72" rx="10" fill="#f8fafc" stroke="#dfe5ec"/>
    <text x="136" y="986" font-size="12" font-weight="800" fill="#667085">原文</text>
    <text x="136" y="1017" font-size="15">View posts</text>
    <rect x="594" y="965" width="488" height="72" rx="10" fill="#f8fafc" stroke="#dfe5ec"/>
    <text x="612" y="986" font-size="12" font-weight="800" fill="#667085">翻訳</text>
    <text x="612" y="1017" font-size="15">投稿を見る</text>

    <text x="118" y="1063" font-size="12" font-weight="800" fill="#667085">長文の場合</text>
    <text x="205" y="1063" font-size="14" fill="#2145c7">全文を表示</text>
  </g>
</svg>