<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PO parser browser benchmark POC</title>
  </head>
  <body>
    <main>
      <h1>PO parser browser benchmark POC</h1>
      <p>
        <code>gettext-converter 1.4.0</code> の correctness gate と
        main-thread parse performance を確認します。
      </p>

      <section>
        <h2>Correctness gate</h2>
        <p id="correctness-status">確認中...</p>
        <ul id="correctness-results"></ul>
      </section>

      <section>
        <h2>Benchmark</h2>
        <p>
          計測対象は parser の parse 処理だけです。各サイズを 5 回計測し、
          min / median / max を表示します。
        </p>
        <button id="run-benchmark" type="button" disabled>Benchmark を実行</button>
        <p id="benchmark-status"></p>
        <table>
          <thead>
            <tr>
              <th>Entries</th>
              <th>Input bytes</th>
              <th>Min (ms)</th>
              <th>Median (ms)</th>
              <th>Max (ms)</th>
              <th>50ms+ parse</th>
            </tr>
          </thead>
          <tbody id="benchmark-results"></tbody>
        </table>
      </section>
    </main>

    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
